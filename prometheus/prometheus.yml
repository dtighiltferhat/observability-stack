# prometheus/prometheus.yml
# Main Prometheus configuration — scrape targets and alerting

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    environment: homelab
    owner:       dtighiltferhat

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/infrastructure.yml"
  - "rules/application.yml"

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: sample-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['sample-app:5000']
    relabel_configs:
      - target_label: app
        replacement: sample-app

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
